{% set name = "qwt-scopy" %}
{% set version = "6.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  git_rev: qwt-multiaxes-updated
  git_url: https://github.com/cseci/qwt.git
  patches:
    # From https://github.com/conda-forge/qwt-feedstock/blob/main/recipe/meta.yaml
    - qwtconfig.pri.patch

build:
  number: 0

requirements:
  build:
    - qt >=4.8
    - make
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - qt >=4.8
  run:
    - qt >=4.8

test:
  commands:
    - test -f "$PREFIX/include/qwt.h"

about:
  home: https://github.com/cseci/qwt
  summary: An extension to the libraries of the Qt Project for technical applications.
  license: Qwt, Version 1.0
  license_file: COPYING

extra:
  recipe-maintainers:
    - myzhang1029
