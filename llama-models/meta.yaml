{% set name = "llama-models" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/llama_models-{{ version }}.tar.gz
  sha256: 064f2e4659794eefb67c0c839b06befd7bf87b5470acc50e163128e1fabb4332

build:
  entry_points:
    - multimodal_example_chat_completion = llama_models.scripts.multimodal_example_chat_completion:main
    - multimodal_example_text_completion = llama_models.scripts.multimodal_example_text_completion:main
    - example_chat_completion = llama_models.scripts.example_chat_completion:main
    - example_text_completion = llama_models.scripts.example_text_completion:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.10
    - setuptools >=61.0
    - pip
  run:
    - python >=3.10
    - fairscale
    - fire
    - pytorch
    - pyyaml
    - jinja2
    - tiktoken
    - pydantic >=2
    - pillow

test:
  imports:
    - llama_models
  commands:
    - pip check
    - multimodal_example_chat_completion --help
    - multimodal_example_text_completion --help
    - example_chat_completion --help
    - example_text_completion --help
  requires:
    - pip

about:
  home: https://github.com/meta-llama/llama-models
  summary: Llama models
  license: Unlicense
  license_file: LICENSE

extra:
  recipe-maintainers:
    - myzhang1029
